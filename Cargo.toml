[workspace]
members = [
  "crates/core",
  "crates/config",
  "crates/market-data",
  "crates/time",
  "crates/monitoring",
  "crates/okx-client",
  "crates/risk",
  "crates/execution",
  "crates/websocket-engine",
  "apps/trader",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
hmac = "0.12"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
